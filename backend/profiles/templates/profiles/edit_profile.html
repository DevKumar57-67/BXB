<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
</head>
<body>

    <h1>Edit Profile</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Profile</button>
    </form>

    <a href="{% url 'my_profile' %}">
        Cancel
    </a>

</body>
</html>
