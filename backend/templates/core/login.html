{% extends "base.html" %}

{% block title %}Login | BitsXBytes{% endblock %}

{% block content %}
<div class="card">
    <h1>Welcome back to BxB</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">Create one</a>
    </p>
</div>
{% endblock %}
