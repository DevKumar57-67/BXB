<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BitsXBytes{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
        }
        nav {
            background: #111827;
            color: #fff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 1rem;
            font-weight: 600;
        }
        nav .brand {
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
        }
        main {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1.25rem;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}" class="brand">BitsXBytes</a>
        <div>
            <a href="{% url 'home' %}">Home</a>
            {% if request.user.is_authenticated %}
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
